[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  # No npm dependencies on purpose — generate-ai.mjs uses only Node built-ins
  # (node:zlib) and the global fetch, so no build/install step is required.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self' https://*.teams.microsoft.com https://*.microsoft.com https://*.office.com;"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
